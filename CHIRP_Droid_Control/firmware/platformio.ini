[platformio]
default_envs = esp32-s3-devkit

; ============================================================================
; Target 1: Waveshare ESP32-S3-Zero (ESP32-S3FH4R2: 4MB QSPI Flash, 2MB QSPI PSRAM)
; ============================================================================
[env:esp32-s3-zero]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.psram_type = qspi
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = default.csv

build_flags =
    -D BOARD_ESP32_S3_ZERO
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=0

lib_deps =
    plerup/EspSoftwareSerial @ ^8.2.0
    adafruit/Adafruit NeoPixel @ ^1.12.3

; ============================================================================
; Target 2: ESP32-S3-DevKitC-1 N16R8 (16MB QSPI Flash, 8MB Octal-SPI PSRAM)
; ============================================================================
[env:esp32-s3-devkit]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

; Note: On DevKitC-1, if using the "USB" port, leave ARDUINO_USB_CDC_ON_BOOT=1.
; If using the "UART" (CP2102/CH343) port, set ARDUINO_USB_CDC_ON_BOOT=0.
build_flags =
    -D BOARD_ESP32_S3_DEVKIT
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=0

lib_deps =
    plerup/EspSoftwareSerial @ ^8.2.0
    adafruit/Adafruit NeoPixel @ ^1.12.3
