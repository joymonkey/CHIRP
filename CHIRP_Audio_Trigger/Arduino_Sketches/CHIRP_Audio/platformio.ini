[platformio]
src_dir = .

[env:rpipico2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#79ce473
board = rpipico2
framework = arduino
board_build.core = earlephilhower
; Lock the Earle Philhower Core to match the Arduino IDE version
platform_packages = framework-arduinopico @ https://github.com/earlephilhower/arduino-pico.git#5.4.4

; --- PERFORMANCE SETTINGS ---
board_build.f_cpu = 250000000L

; --- HARDWARE & MEMORY OVERRIDES ---
board_upload.maximum_size = 16777216 
board_build.filesystem_size = 14m  
; 8MB PSRAM — This feeds into the linker script via __PSRAM_LENGTH__
board_upload.psram_length = 8388608

; Remove default -Os so we can replace it with -Ofast
build_unflags = -Os

build_flags =
    ; Optimization: Match Arduino IDE "Fast (-Ofast)" setting
    -Ofast
    ; Enable TinyUSB built into the Philhower Core
    -D USE_TINYUSB
    ; RP2350 Specific PSRAM Enable (Assigns CS to GPIO 0)
    -D RP2350_PSRAM_CS=0
    -D PSRAM_SPEED_133MHZ
    -D ARDUINO_ARCH_RP2040

; Note: -fno-exceptions and -fno-rtti are automatically added by the
; framework's platformio-build.py (to CXXFLAGS only, avoiding C warnings).
; LWIP_IPV6=0 is also set by default unless PIO_FRAMEWORK_ARDUINO_ENABLE_IPV6 is defined.

lib_archive = no

; --- DEPENDENCIES ---
; Note: SD, Wire, SPI, and TinyUSB are omitted here because 
; they are provided directly by the earlephilhower core.
lib_deps = 
    https://github.com/pschatzmann/arduino-libhelix.git#v0.9.2
    bakercp/CRC32 @ ^2.0.0
    adafruit/Adafruit NeoPixel @ ^1.12.3